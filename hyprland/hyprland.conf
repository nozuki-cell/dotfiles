# ╔══════════════════════════════════════════╗
# ║       Minimalistic Hyprland Config       ║
# ╚══════════════════════════════════════════╝

# ── Monitor ────────────────────────────────
monitor = , 1920x1080@60, auto, 1

# ── Autostart ──────────────────────────────
exec-once = waybar
exec-once = kitty
exec-once = swaybg -m fill -i ~/wallpaper.jpg
exec-once = wl-paste --type text --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Environment Variables ──────────────────
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Bibata-Modern-Classic
env = QT_QPA_PLATFORMTHEME, qt6ct
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland
env = CLUTTER_BACKEND, wayland

# ── Input ──────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── General ────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)
    layout = dwindle
    allow_tearing = false
}

# ── Decoration ─────────────────────────────
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 1.0
        brightness = 0.8
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        new_optimizations = true
        xray = false
        popups = true
    }

    drop_shadow = true
    shadow_range = 15
    shadow_render_power = 3
    shadow_offset = 0 2
    col.shadow = rgba(1a1a2eaa)
    col.shadow_inactive = rgba(1a1a2e55)

    dim_inactive = false

    # Full transparency for active windows
    active_opacity = 0.92
    inactive_opacity = 0.85
}

# ── Animations ─────────────────────────────
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    bezier = overshoot, 0.13, 0.99, 0.3, 1.1

    animation = windows, 1, 5, snappy, slide
    animation = windowsOut, 1, 5, snappy, slide
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth, slide
    animation = layers, 1, 3, smooth, fade
}

# ── Layouts ────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
    no_gaps_when_only = false
}

master {
    new_status = master
}

# ── Misc ───────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    new_window_takes_over_fullscreen = 2
    middle_click_paste = false
}

# ── Window Rules ───────────────────────────
windowrulev2 = opacity 0.0 0.0, floating:0
windowrulev2 = opacity 0.95 0.85, title:^(Picture-in-Picture)$
windowrulev2 = opacity 0.95 0.85, title:^(Open File)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(kvantummanager)$
windowrulev2 = float, class:^(qt5ct)$
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(walker)$
windowrulev2 = opacity 0.8 0.7, class:^(kitty)$
windowrulev2 = opacity 0.8 0.7, class:^(thunar)$

# ── Layer Rules ────────────────────────────
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = blur, rofi
layerrule = blur, hyprpicker
layerrule = blur, notification

# ── Keybinds ───────────────────────────────
$mod = SUPER

# Core
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, D, exec, wofi --show drun
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, M, exit
bind = $mod, E, exec, thunar

# Screenshots
bind = , Print, exec, grimblast copy area
bind = $mod, Print, exec, grimblast copy screen

# Clipboard
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Resize
bind = $mod CTRL, H, resizeactive, -30 0
bind = $mod CTRL, L, resizeactive, 30 0
bind = $mod CTRL, K, resizeactive, 0 -30
bind = $mod CTRL, J, resizeactive, 0 30

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume & Brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
